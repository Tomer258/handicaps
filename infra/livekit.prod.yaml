# LiveKit SFU for production (single node, no Redis). Copy to /srv/hangar/config/livekit.yaml and replace
# turn.example.com. Keys live in a separate root-owned 0600 file (key_file), never in this template.
#
# Verified with livekit-server v1.9.1 (bind test, see docs/runbooks/deploy.md):
#   127.0.0.1:7880 signaling/RoomService (Caddy + API only)   127.0.0.1:6789 metrics
#   *:7881/tcp ICE/TCP (public)   *:7882/udp ICE/UDP mux (public)   *:3478/udp TURN (public)
#   *:5349/tcp TURN plaintext backend — LiveKit binds it on ALL interfaces: the host firewall MUST drop 5349
#   from outside (Caddy terminates TURN/TLS on 443 and forwards to 127.0.0.1:5349).
port: 7880
bind_addresses:
  - 127.0.0.1
log_level: info

rtc:
  tcp_port: 7881
  udp_port: 7882
  # Advertise the VPS public address (STUN lookup). Set node_ip explicitly if the provider NAT confuses it.
  use_external_ip: true

turn:
  enabled: true
  domain: turn.example.com
  tls_port: 5349
  udp_port: 3478
  # Caddy (layer4) terminates TLS for turn.example.com on TCP 443.
  external_tls: true

key_file: /etc/livekit/keys.yaml

room:
  # Rooms are created by the API (CreateRoom, 16 slots: 15 humans + soundboard publisher).
  auto_create: false
  empty_timeout: 300

webhook:
  # Must be a key name present in key_file; the API verifies the signature with the matching secret.
  api_key: hangar
  urls:
    - http://127.0.0.1:8080/internal/livekit/webhook

prometheus:
  port: 6789
