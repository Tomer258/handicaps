# Local development dependencies. The API (dotnet run) and Angular (ng serve) run on the host.
# Usage: docker compose -f infra/compose.dev.yml up -d
name: hangar-dev

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: hangar
      POSTGRES_USER: hangar
      POSTGRES_PASSWORD: hangar
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hangar -d hangar"]
      interval: 5s
      timeout: 3s
      retries: 20

  livekit:
    image: livekit/livekit-server:v1.9.1
    command: ["--config", "/etc/livekit.yaml", "--node-ip", "127.0.0.1"]
    volumes:
      - ./livekit.dev.yaml:/etc/livekit.yaml:ro
    ports:
      - "127.0.0.1:7880:7880"
      - "127.0.0.1:7881:7881"
      - "127.0.0.1:7882:7882/udp"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata:
