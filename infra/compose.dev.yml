# Local development dependencies. The API (dotnet run) and Angular (ng serve) run on the host.
# Usage: docker compose -f infra/compose.dev.yml up -d
name: hangar-dev

services:
  postgres:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_DB: hangar
      POSTGRES_USER: hangar
      POSTGRES_PASSWORD: hangar
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hangar -d hangar"]
      interval: 5s
      timeout: 3s
      retries: 20

  livekit:
    image: livekit/livekit-server:v1.9.1@sha256:c039a1bfa154c8479ac369c380665638e92a7e9531e69664549c0c0d3eb65e63
    command: ["--config", "/etc/livekit.yaml", "--node-ip", "127.0.0.1"]
    volumes:
      - ./livekit.dev.yaml:/etc/livekit.yaml:ro
    ports:
      - "127.0.0.1:7880:7880"
      - "127.0.0.1:7881:7881"
      - "127.0.0.1:7882:7882/udp"
      # sound-publisher shares this network namespace; its private command port is published on loopback only.
      - "127.0.0.1:8090:8090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Publish-only soundboard participant. Shares livekit's network namespace so ws://127.0.0.1:7880 reaches the SFU.
  sound-publisher:
    build: ../workers/sound-publisher
    network_mode: service:livekit
    depends_on: [livekit]
    environment:
      LIVEKIT_URL: ws://127.0.0.1:7880
      API_URL: http://host.docker.internal:5080
      WORKER_KEY: hangar-dev-worker-key-local-only-0123456789
      SOUNDS_ROOT: /data
    volumes:
      - ../.data/files/sounds:/data/sounds:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  # Untrusted-upload processing: no network, no secrets, unprivileged, bounded resources.
  asset-validator:
    build: ../workers/asset-validator
    network_mode: none
    volumes:
      - ../.data/files/quarantine:/data/quarantine:ro
      - ../.data/files/spool:/data/spool
      - ../.data/files/sounds:/data/sounds
      - ../.data/files/images:/data/images
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 768m
    pids_limit: 64
    restart: unless-stopped

volumes:
  pgdata:
