# Hangar production (one VPS). Templates only — see docs/runbooks/deploy.md before using.
#   docker compose -f infra/compose.prod.yml --env-file /srv/hangar/config/hangar.env up -d
#
# Topology: edge (Caddy), livekit, api and sound-publisher use host networking and talk over 127.0.0.1;
# postgres is published on loopback only; asset-validator has no network at all.
# Public ports (host firewall + provider firewall): 80/tcp, 443/tcp, 7881/tcp, 7882/udp, 3478/udp, 22/tcp (admin IPs).
name: hangar

x-logging: &logging
  driver: json-file
  options: { max-size: "20m", max-file: "5" }

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  logging: *logging

services:
  edge:
    image: hangar-edge:${HANGAR_VERSION:?set HANGAR_VERSION}
    build: { context: .., dockerfile: infra/caddy/Dockerfile }
    network_mode: host
    <<: *hardening
    cap_add: [NET_BIND_SERVICE]
    environment:
      APP_HOST: ${APP_HOST:?}
      RTC_HOST: ${RTC_HOST:?}
      TURN_HOST: ${TURN_HOST:?}
      ACME_EMAIL: ${ACME_EMAIL:?}
    volumes:
      - ${HANGAR_ROOT:-/srv/hangar}/caddy/data:/data
      - ${HANGAR_ROOT:-/srv/hangar}/caddy/config:/config
      - ${HANGAR_ROOT:-/srv/hangar}/watchdog:/run/hangar-watchdog:ro
    tmpfs: [/tmp]
    mem_limit: 256m

  # Closes public voice (edge flag + LiveKit room deletion) when reconciliation is unhealthy for 60 s.
  # The host directory must be owned by uid 10003 (see runbooks/deploy.md).
  auth-watchdog:
    image: hangar-auth-watchdog:${HANGAR_VERSION:?}
    build: { context: ../workers/auth-watchdog }
    network_mode: host
    <<: *hardening
    env_file:
      - ${HANGAR_ROOT:-/srv/hangar}/config/watchdog.env
    environment:
      API_URL: http://127.0.0.1:8080
      LIVEKIT_URL: http://127.0.0.1:7880
      FLAG_PATH: /run/hangar-watchdog/closed
    volumes:
      - ${HANGAR_ROOT:-/srv/hangar}/watchdog:/run/hangar-watchdog
    tmpfs: [/tmp]
    depends_on: [livekit]
    mem_limit: 64m

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    logging: *logging
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_DB: hangar
      POSTGRES_USER: hangar
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ${HANGAR_ROOT:-/srv/hangar}/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hangar -d hangar"]
      interval: 10s
      timeout: 3s
      retries: 10
    shm_size: 128m
    mem_limit: 1g

  # One-off release job: `docker compose ... run --rm migrate` (backup first; see runbooks/deploy.md).
  migrate:
    image: hangar-api:${HANGAR_VERSION:?}
    build: { context: ../apps/api }
    profiles: [release]
    network_mode: host
    <<: *hardening
    restart: "no"
    command: ["--migrate"]
    env_file:
      - ${HANGAR_ROOT:-/srv/hangar}/config/api.env
    volumes:
      - ${HANGAR_ROOT:-/srv/hangar}/data:/data
    depends_on:
      postgres: { condition: service_healthy }

  api:
    image: hangar-api:${HANGAR_VERSION:?}
    build: { context: ../apps/api }
    network_mode: host
    <<: *hardening
    env_file:
      - ${HANGAR_ROOT:-/srv/hangar}/config/api.env
    environment:
      Hangar__MigrateOnStartup: "false"
    volumes:
      # keys/ (Data Protection, back up!) and files/{quarantine,spool,sounds,images,attachments}
      - ${HANGAR_ROOT:-/srv/hangar}/data:/data
    tmpfs: [/tmp]
    depends_on:
      postgres: { condition: service_healthy }
    mem_limit: 768m

  livekit:
    image: livekit/livekit-server:v1.9.1
    network_mode: host
    restart: unless-stopped
    logging: *logging
    security_opt: ["no-new-privileges:true"]
    command: ["--config", "/etc/livekit/livekit.yaml"]
    volumes:
      - ${HANGAR_ROOT:-/srv/hangar}/config/livekit.yaml:/etc/livekit/livekit.yaml:ro
      - ${HANGAR_ROOT:-/srv/hangar}/config/livekit-keys.yaml:/etc/livekit/keys.yaml:ro
    mem_limit: 2g

  sound-publisher:
    image: hangar-sound-publisher:${HANGAR_VERSION:?}
    build: { context: ../workers/sound-publisher }
    network_mode: host
    <<: *hardening
    env_file:
      - ${HANGAR_ROOT:-/srv/hangar}/config/publisher.env
    environment:
      LIVEKIT_URL: ws://127.0.0.1:7880
      API_URL: http://127.0.0.1:8080
      LISTEN_HOST: 127.0.0.1
      LISTEN_PORT: "8090"
      SOUNDS_ROOT: /data
    volumes:
      - ${HANGAR_ROOT:-/srv/hangar}/data/files/sounds:/data/sounds:ro
    depends_on: [livekit, api]
    mem_limit: 512m

  # Untrusted uploads: no network, no secrets, bounded resources.
  asset-validator:
    image: hangar-asset-validator:${HANGAR_VERSION:?}
    build: { context: ../workers/asset-validator }
    network_mode: none
    <<: *hardening
    volumes:
      - ${HANGAR_ROOT:-/srv/hangar}/data/files/quarantine:/data/quarantine:ro
      - ${HANGAR_ROOT:-/srv/hangar}/data/files/spool:/data/spool
      - ${HANGAR_ROOT:-/srv/hangar}/data/files/sounds:/data/sounds
      - ${HANGAR_ROOT:-/srv/hangar}/data/files/images:/data/images
    tmpfs: [/tmp]
    mem_limit: 768m
    pids_limit: 64

  # Nightly: `docker compose ... run --rm backup` from the host's cron (see runbooks/backup-restore.md).
  backup:
    image: hangar-backup:${HANGAR_VERSION:?}
    build: { context: backup }
    profiles: [ops]
    network_mode: host
    restart: "no"
    logging: *logging
    security_opt: ["no-new-privileges:true"]
    env_file:
      - ${HANGAR_ROOT:-/srv/hangar}/config/backup.env
    secrets: [postgres_password]
    volumes:
      - ${HANGAR_ROOT:-/srv/hangar}/data:/data:ro
      - ${HANGAR_ROOT:-/srv/hangar}/config:/config:ro
      - ${HANGAR_ROOT:-/srv/hangar}/backups:/backups

secrets:
  postgres_password:
    file: ${HANGAR_ROOT:-/srv/hangar}/config/postgres_password
